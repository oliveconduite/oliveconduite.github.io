<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permis Score — Olive Conduite</title>
<meta name="theme-color" content="#0B0A09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Permis Score">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">

<style>
:root{
  --noir:#0B0A09; --orange:#F26522; --fonce:#BF4A12;
  --papier:#F7F5F2; --blanc:#fff; --ligne:#E2DDD6;
  --texte:#141210; --doux:#5C5651; --pale:#8A847C;
  --vert:#1E7A34; --rouge:#C4321A; --ambre:#E08A1E;
  --haut:env(safe-area-inset-top); --bas:env(safe-area-inset-bottom);
  --barre:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--papier);color:var(--texte);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
[hidden]{display:none !important}

/* ---------- structure d'ensemble : rail (desktop) + colonne ---------- */
.app{display:flex}

/* rail latéral, masqué en mobile */
.rail{display:none}

.colonne{flex:1;min-width:0;display:flex;flex-direction:column}

header{position:relative;z-index:30;background:var(--noir);color:#fff;
  padding:calc(10px + var(--haut)) 14px 11px}
.hd{display:flex;align-items:center;gap:10px;min-height:34px}
.logo{height:30px;width:auto;color:#fff}
.titres{display:flex;flex-direction:column;justify-content:center}
.sous{font-size:10.5px;color:#a9a39b;margin-top:2px}
.hd .ttl{font-size:17px;font-weight:800;letter-spacing:.3px}
.ico{width:34px;height:34px;border:1px solid #33302c;display:grid;place-items:center;flex:none}
.ico svg{width:17px;height:17px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ico.tourne svg{animation:tr .9s linear infinite}
@keyframes tr{to{transform:rotate(360deg)}}
.pousse{margin-left:auto}
.dateJour{font-size:11.5px;font-weight:700;color:#c9c3bb;letter-spacing:.3px;text-align:right;
  text-transform:capitalize;line-height:1.25;max-width:120px}
.contact{display:flex;gap:8px;margin-top:12px}
.contact a{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ligne);
  padding:9px 13px;font-size:14px;font-weight:600;color:var(--fonce);text-decoration:none}
.contact a:active{background:#FFF4EE;border-color:var(--orange)}
.contact a svg{width:17px;height:17px;fill:none;stroke:var(--fonce);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.contact .lien-tel{flex:1}
.contact .lien-sms{flex:none}

/* barre de recherche d'en-tête (écran recherche seulement) */
.chercher{margin-top:10px;position:relative}
.chercher input{width:100%;background:#1a1815;border:1px solid #33302c;color:#fff;
  padding:11px 12px 11px 38px;font-size:16px}
.chercher input::placeholder{color:#7d7770}
.chercher > svg{position:absolute;left:12px;top:12px;width:17px;height:17px;fill:none;stroke:#7d7770;stroke-width:2}

main{flex:1;padding:14px 14px calc(18px + var(--barre) + var(--bas))}
.vue{display:none}
.vue.on{display:block;animation:ap .16s ease-out}
@keyframes ap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.wrap{max-width:640px;margin:0 auto}

.bandeau{padding:9px 13px;font-size:13px;font-weight:600;text-align:center}
.bandeau.demo{background:var(--orange);color:#140800}
.bandeau.ok{background:#D7F0DB;color:#14532A}
.bandeau.ko{background:#FFE0DA;color:#8C1C0A}

/* ---------- titres de section ---------- */
.jour{font-size:12px;font-weight:800;letter-spacing:1.4px;color:var(--fonce);text-transform:uppercase}
.bonjour{font-size:24px;font-weight:800;line-height:1.1;margin-bottom:2px}
.section-tt{font-size:11px;font-weight:800;letter-spacing:1.3px;color:var(--pale);
  text-transform:uppercase;margin:22px 2px 10px}
.filet{height:1px;background:var(--ligne);margin:14px 0}

/* ---------- carte "prochain élève" ---------- */
.hero{background:var(--noir);color:#fff;padding:18px 18px 16px;margin-bottom:4px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
  background:radial-gradient(circle,rgba(242,101,34,.28),transparent 70%)}
.hero .q{font-size:11px;font-weight:700;letter-spacing:1px;color:#a9a39b;text-transform:uppercase}
.hero .n{font-size:22px;font-weight:800;margin-top:3px}
.hero .h{font-size:15px;color:#F2A878;font-weight:700;margin-top:1px}
.hero .obj{display:inline-flex;align-items:center;gap:7px;background:#1f1c19;border:1px solid #38332e;
  padding:7px 11px;margin-top:12px;font-size:13px}
.hero .obj b{color:var(--orange);font-weight:700}
.hero .go{display:block;width:100%;text-align:center;background:var(--orange);color:#140800;
  font-weight:800;font-size:15px;letter-spacing:.3px;padding:12px;margin-top:14px;position:relative;z-index:2}
.hero .go:active{background:#FF7A38}

/* ---------- carte élève (liste / récents) ---------- */
.carte{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--blanc);
  border:1px solid var(--ligne);border-left:4px solid var(--orange);padding:13px 14px;margin-bottom:8px}
.carte:active{background:#FFF7F2}
.carte.pret{border-left-color:var(--vert)}
.carte.inactif{opacity:.55}
.carte .txt{flex:1;min-width:0}
.carte .nom{font-size:16px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carte .sub{font-size:12px;color:var(--pale);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.carte .val{flex:none;text-align:right}
.carte .val .p{font-size:22px;font-weight:800;color:var(--fonce);line-height:1;font-variant-numeric:tabular-nums}
.carte .val .p.ok{color:var(--vert)}
.carte .val .p em{font-size:10px;color:var(--pale);font-style:normal;font-weight:400}
.pastille{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;margin-left:3px}
.pastille.v{background:var(--vert)}.pastille.o{background:var(--ambre)}.pastille.r{background:var(--rouge)}
.carte .chev{flex:none;width:9px;height:9px;border-right:2px solid var(--pale);border-bottom:2px solid var(--pale);
  transform:rotate(-45deg);margin-left:2px}

/* ---------- blocs génériques ---------- */
.bloc{background:var(--blanc);border:1px solid var(--ligne);padding:15px;margin-bottom:9px}
.tt{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:var(--fonce);margin-bottom:11px}
.grand{font-size:54px;font-weight:800;color:var(--fonce);line-height:.92;font-variant-numeric:tabular-nums}
.grand.ok{color:var(--vert)}
.grand em{font-size:18px;color:var(--pale);font-style:normal;font-weight:400}

.retour{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--fonce);font-weight:600;padding:2px 0 12px}

/* jauge */
.jauge{background:var(--ligne);height:11px;position:relative}
.jauge i{display:block;height:100%;background:var(--orange);transition:width .35s}
.jauge.ok i{background:var(--vert)}
.jauge u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--noir)}
.info{font-size:12px;color:var(--doux);margin-top:8px}
.puce{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:4px 9px;
  background:#EFEBE5;color:var(--doux);margin-top:9px}
.puce.ok{background:var(--vert);color:#fff}
.puce.urgent{background:#FFE8DE;color:var(--fonce)}

/* objectif prochaine séance */
.cible{background:#FFF4EE;border:1px solid #F6D8C6;border-left:4px solid var(--orange);padding:14px}
.cible .tt{margin-bottom:6px}
.cible .obj-nom{font-size:17px;font-weight:800;color:var(--texte)}
.cible .liste{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;font-weight:600;background:#fff;border:1px solid #F0CBB4;color:var(--fonce);padding:5px 9px}

/* à travailler / points forts */
.critere{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ligne)}
.critere:last-child{border-bottom:none}
.critere .rd{width:11px;height:11px;border-radius:50%;flex:none}
.rd.r{background:var(--rouge)}.rd.o{background:var(--ambre)}.rd.v{background:var(--vert)}
.critere .cn{flex:1;font-size:14.5px;font-weight:600}
.critere .cm{font-size:12px;color:var(--pale)}
.critere .cv{font-size:13px;font-weight:700;color:var(--doux);font-variant-numeric:tabular-nums}

/* onglets fiche */
.onglets{display:flex;gap:2px;background:#EDE8E1;padding:3px;margin-bottom:12px;z-index:10}
.onglets button{flex:1;padding:9px 4px;font-size:13px;font-weight:700;color:var(--doux)}
.onglets button[aria-selected=true]{background:#fff;color:var(--texte);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* compétences détaillées, groupées */
.groupe-tt{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--pale);text-transform:uppercase;margin:16px 0 8px}
.groupe-tt:first-child{margin-top:0}
.comp{margin-bottom:11px}
.comp:last-child{margin-bottom:0}
.comp .l{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:4px}
.comp .l small{color:var(--pale);font-size:11.5px;margin-left:6px}
.comp .l b{font-variant-numeric:tabular-nums}
.comp .b{background:#EFEBE5;height:9px}
.comp .b i{display:block;height:100%;background:var(--orange)}
.comp.faible .b i{background:var(--rouge)}
.comp.acquise .b i{background:var(--vert)}

.courbe{width:100%;height:80px;display:block}
.suite{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--doux);margin-top:6px}

/* historique */
.histo{border-top:1px solid var(--ligne);padding:11px 0;display:flex;gap:12px;align-items:flex-start}
.histo:first-of-type{border-top:none}
.histo .sc{font-size:19px;font-weight:800;color:var(--fonce);min-width:44px;font-variant-numeric:tabular-nums}
.histo .d{font-size:13.5px;font-weight:600}
.histo .t{font-size:12.5px;color:var(--doux)}

/* boutons */
.btn{display:block;width:100%;text-align:center;background:var(--orange);color:#140800;
  font-weight:800;font-size:16px;letter-spacing:.3px;padding:14px;border:2px solid var(--orange);margin-bottom:9px}
.btn:active{background:#FF7A38}
.btn.noir{background:var(--noir);border-color:var(--noir);color:#fff}
.btn.vide{background:transparent;color:var(--texte);border-color:var(--ligne)}
.btn.danger{background:transparent;color:var(--rouge);border-color:#F0CFC8}
.btn[disabled]{opacity:.5}
.btn-eval{z-index:8;box-shadow:0 6px 18px rgba(191,74,18,.35)}

/* formulaires */
label{display:block;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--fonce);margin:14px 0 5px}
input[type=text],input[type=email],input[type=date],input[type=search],textarea,select{width:100%;background:#fff;
  border:1px solid var(--ligne);padding:12px;font-size:16px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--orange)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;min-width:64px;text-align:center;border:1.5px solid var(--ligne);background:#fff;padding:11px 6px;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{border-color:var(--orange);background:#FFF4EE;color:var(--fonce)}

.bascule{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--ligne);padding:13px;margin:10px 0 0;cursor:pointer}
.bascule input{width:22px;height:22px;accent-color:var(--orange);flex:none}
.bascule span{font-size:14px}
.bascule small{display:block;color:var(--pale);font-size:12px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.aide{font-size:12px;color:var(--pale);margin-top:5px}
.mot{background:#F7F5F2;border-left:4px solid var(--noir);padding:10px 12px;margin-top:8px;
  font-size:13.5px;font-style:italic;color:var(--texte);white-space:pre-line}
.note-suivi{white-space:pre-line;font-size:14px;color:var(--texte)}
.note-vide{font-size:13.5px;color:var(--pale);font-style:italic}

/* ---------- ÉVALUATION : gros boutons pouce ---------- */
.eval-comp{background:var(--blanc);border:1px solid var(--ligne);padding:14px;margin-bottom:10px}
.eval-comp.rempli{border-left:4px solid var(--vert)}
.eval-comp .cn{font-size:16px;font-weight:700;margin-bottom:3px}
.eval-comp .ca{font-size:12px;color:var(--pale);margin-bottom:11px}
.eval-grille{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eval-grille button{padding:15px 8px;font-size:14.5px;font-weight:700;border:2px solid var(--ligne);
  background:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.15}
.eval-grille button .em{font-size:19px}
.eval-grille button[aria-pressed=true]{color:#fff}
.eval-grille button.n1[aria-pressed=true]{background:var(--rouge);border-color:var(--rouge)}
.eval-grille button.n2[aria-pressed=true]{background:var(--ambre);border-color:var(--ambre);color:#241200}
.eval-grille button.n3[aria-pressed=true]{background:var(--vert);border-color:var(--vert)}
.eval-grille button.n4[aria-pressed=true]{background:var(--noir);border-color:var(--noir)}
button.skip{width:100%;margin-top:8px;padding:11px;font-size:13.5px;font-weight:600;color:var(--doux);
  border:1.5px dashed var(--ligne);background:#fff}
button.skip[aria-pressed=true]{border-style:solid;border-color:var(--pale);background:#EFEBE5;color:var(--texte)}
.eval-comp.saute{border-left:4px solid var(--pale);opacity:.9}

.ajout-comp{border:2px dashed var(--ligne);background:transparent;color:var(--fonce);font-weight:700;
  width:100%;padding:14px;font-size:15px;margin-bottom:10px}
.ajout-comp:active{background:#FFF4EE}
.choix-comp{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}
.choix-comp button{border:1.5px solid var(--ligne);background:#fff;padding:9px 12px;font-size:13.5px;font-weight:600}
.choix-comp button:active{border-color:var(--orange);background:#FFF4EE}

/* ---------- écran fin de séance ---------- */
.fin-wrap{max-width:520px;margin:0 auto}
.fin-tt{text-align:center;font-size:22px;font-weight:800;margin:6px 0 2px}
.fin-nom{text-align:center;font-size:16px;color:var(--doux);margin-bottom:18px}
.delta{text-align:center;background:var(--blanc);border:1px solid var(--ligne);padding:20px;margin-bottom:14px}
.delta .g{font-size:52px;font-weight:800;line-height:1;color:var(--vert);font-variant-numeric:tabular-nums}
.delta .g.neg{color:var(--rouge)}.delta .g.nul{color:var(--doux)}
.delta .l{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--pale);text-transform:uppercase;margin-top:6px}
.delta .sc{font-size:14px;color:var(--doux);margin-top:8px}
.rub{background:var(--blanc);border:1px solid var(--ligne);padding:14px;margin-bottom:10px}
.rub .h{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.rub.p .h{color:var(--vert)}.rub.s .h{color:var(--ambre)}.rub.c .h{color:var(--fonce)}
.rub .item{font-size:15px;font-weight:600;padding:4px 0}

/* ---------- écran partage bilan (aperçu) ---------- */
.share-card{background:var(--blanc);border:2px solid var(--noir);padding:0;margin-bottom:14px;overflow:hidden}
.share-head{background:var(--noir);color:#fff;padding:16px 18px}
.share-head .k{font-size:11px;letter-spacing:2px;color:var(--orange);font-weight:800}
.share-head .n{font-size:20px;font-weight:800;margin-top:4px}
.share-head .d{font-size:12.5px;color:#a9a39b;margin-top:2px}
.share-body{padding:16px 18px}
.share-body .s-tt{font-size:10.5px;font-weight:800;letter-spacing:1px;color:var(--pale);text-transform:uppercase;margin:14px 0 7px}
.share-body .s-tt:first-child{margin-top:0}
.share-pts{font-size:38px;font-weight:800;color:var(--fonce);font-variant-numeric:tabular-nums;line-height:1}
.share-li{font-size:14.5px;font-weight:600;padding:2px 0}
.canaux{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.canaux .btn{margin-bottom:0}

/* ---------- états / pied ---------- */
.etat{padding:40px 18px;text-align:center;color:var(--doux);font-size:14.5px}
.etat b{display:block;font-size:17px;color:var(--texte);margin-bottom:7px}
.etat code{display:block;background:#EFEBE5;padding:9px;margin-top:11px;font-size:11px;text-align:left;word-break:break-all}
.pied{text-align:center;font-size:11.5px;color:var(--pale);padding:20px 0 4px;white-space:pre-line}

.attente{position:fixed;inset:0;background:rgba(11,10,9,.55);display:none;place-items:center;z-index:60}
.attente.on{display:grid}
.attente div{background:#fff;padding:20px 26px;font-size:14px;font-weight:600}

/* ---------- BARRE D'ONGLETS (mobile) ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--blanc);
  border-top:1px solid var(--ligne);display:flex;padding-bottom:var(--bas);
  box-shadow:0 -2px 12px rgba(0,0,0,.05)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;color:var(--pale);font-size:10.5px;font-weight:700}
.tabbar button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current=true]{color:var(--fonce)}
.tabbar .central{margin-top:-16px}
.tabbar .central .rond{width:54px;height:54px;border-radius:50%;background:var(--orange);
  display:grid;place-items:center;box-shadow:0 4px 12px rgba(191,74,18,.4);border:3px solid var(--papier)}
.tabbar .central .rond svg{width:26px;height:26px;stroke:#140800;stroke-width:2.6}
.tabbar .central span{color:var(--fonce);margin-top:2px}

/* ---------- DESKTOP / TABLETTE : rail latéral ---------- */
@media (min-width:820px){
  :root{--barre:0px}
  .rail{display:flex;flex-direction:column;width:236px;flex:none;background:var(--noir);color:#fff;
    padding:22px 16px calc(22px + var(--bas));position:sticky;top:0;height:100vh;gap:4px}
  .rail .marque{display:flex;flex-direction:column;gap:8px;padding:2px 8px 20px;border-bottom:1px solid #262320;margin-bottom:14px}
  .rail .marque .logo{height:34px}
  .rail .marque .sous{font-size:11px;color:#a9a39b}
  .rail .lien{display:flex;align-items:center;gap:13px;padding:12px 14px;font-size:15px;font-weight:600;color:#c9c3bb;border-radius:2px}
  .rail .lien svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .rail .lien:hover{background:#1c1916;color:#fff}
  .rail .lien[aria-current=true]{background:#231f1b;color:#fff}
  .rail .lien.eval{background:var(--orange);color:#140800;margin:6px 0}
  .rail .lien.eval:hover{background:#FF7A38}
  .rail .creux{flex:1}
  .tabbar{display:none}
  header{display:none}
  main{padding:26px 30px 40px}
  .wrap,.fin-wrap{max-width:760px}
  .onglets{position:sticky;top:0}
  .btn-eval{position:sticky;bottom:14px}
}
@media (min-width:1120px){ .wrap,.fin-wrap{max-width:860px} }
</style>

<script>
/* ====================================================================
   RÉGLAGES — deux lignes à remplacer.
   Tableur : menu Olive Conduite > Réglages de l'application
   ==================================================================== */
var ADRESSE = "https://script.google.com/macros/s/AKfycbypiN_Wk1R01iTvF2_4-NHBhZ95IZ8w55p4wCjesXW-Itu4ZwoKFDZiRAHA2KZSQGAM8w/exec";
var CLE     = "olive-2026-change-moi";
/* ==================================================================== */

var D = null, filtre = "", courant = null, DEMO = false;
var COMP = ["Maîtrise du véhicule","Observation","Anticipation","Intersections","Priorités",
            "Vitesse et allure","Stationnement et manœuvres","Autonomie","Environnement complexe"];
/* familles pour l'affichage détaillé des compétences */
var FAMILLES = [
  { nom:"Maîtrise du véhicule", idx:[0,7] },
  { nom:"Observation et anticipation", idx:[1,2] },
  { nom:"Circulation", idx:[3,4,5] },
  { nom:"Manœuvres et environnement", idx:[6,8] }
];
var PACKS = [
  "Permis B – Pack Classic",
  "Permis B – Pack Accompagné",
  "Permis B – Pack Supervisé",
  "Permis B – Pack Sénior",
  "Pack AM – voiture sans permis",
  "Parcours Permis Confiance",
  "Code de la route seul",
  "Perfectionnement ou annulation"
];
var MOTS = {0:"non abordé",1:"découverte",2:"guidé",3:"peu guidé",4:"autonome"};

/* ---------------------------------------------------------- utilitaires */
function $(id){ return document.getElementById(id); }
function ech(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function flash(msg, ok){
  var f = $("flash");
  f.textContent = msg + (ok ? "" : "   (toucher pour fermer)");
  f.className = "bandeau " + (ok ? "ok" : "ko");
  f.hidden = false;
  clearTimeout(flash.t);
  if (ok) flash.t = setTimeout(function(){ f.hidden = true; }, 6000);
}
document.getElementById("flash").addEventListener("click", function(){ this.hidden = true; });
function attente(on, txt){ $("attenteTxt").textContent = txt || "Enregistrement…"; $("attente").classList.toggle("on", !!on); }

function blocDest(e, prefixe) {
  var l = [];
  if (e.email)  l.push({ id: prefixe + "Eleve",  lab: "Élève",            adr: e.email,  coche: true  });
  if (e.email2 && e.email2 !== e.email)
                l.push({ id: prefixe + "Parent", lab: "Parent ou tuteur", adr: e.email2, coche: false });
  if (!l.length) return '<div class="aide">Aucune adresse e-mail renseignée pour cet élève.</div>';
  return l.map(function (d) {
    return '<label class="bascule"><input type="checkbox" id="' + d.id + '"'
      + (d.coche ? " checked" : "") + '>'
      + '<span>' + d.lab + '<small>' + ech(d.adr) + '</small></span></label>';
  }).join("");
}
function litDest(prefixe) {
  var a = $(prefixe + "Eleve"), b = $(prefixe + "Parent");
  return { dEleve: (a && a.checked) ? 1 : 0, dParent: (b && b.checked) ? 1 : 0 };
}
function eleve(nom){ if(!D) return null; for (var i=0;i<D.eleves.length;i++) if (D.eleves[i].nom===nom) return D.eleves[i]; return null; }
function score(niv){ var s=0; for(var i=0;i<niv.length;i++) s+=niv[i]; return Math.round(s/36*100); }
function auj(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
var JOURS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
var MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function dateLisible(){ var d=new Date(); return JOURS[d.getDay()]+" "+d.getDate()+" "+MOIS[d.getMonth()]; }
function pastilleClasse(e){ if(e.pret) return "v"; if(e.score!=null && e.score>=60) return "o"; return "r"; }

/* ---------------------------------------------------------- appels serveur */
function appel(params, ensuite) {
  if (DEMO) { ensuite({ ok:false, erreur:"Mode démonstration : rien n'est enregistré." }); return; }
  var nomCb = "cb" + Date.now();
  var fini = false;
  window[nomCb] = function (r) {
    fini = true; attente(false);
    try { delete window[nomCb]; } catch (e) { window[nomCb] = undefined; }
    ensuite(r);
  };
  var url = ADRESSE + "?cle=" + encodeURIComponent(CLE) + "&callback=" + nomCb + "&t=" + Date.now();
  for (var k in params) if (params.hasOwnProperty(k)) url += "&" + k + "=" + encodeURIComponent(params[k]);
  var s = document.createElement("script");
  s.src = url;
  s.onerror = function () { if (!fini) { attente(false); ensuite({ ok:false, erreur:"Connexion impossible." }); } };
  document.body.appendChild(s);
  setTimeout(function(){ if(!fini){ attente(false); ensuite({ ok:false, erreur:"Le serveur ne répond pas." }); } }, 20000);
}

function charger(silencieux) {
  if (ADRESSE.indexOf("METTEZ_VOTRE_ADRESSE_ICI") >= 0) {
    DEMO = true; $("bandeauDemo").hidden = false; D = jeuDemo(); rendreOnglet(); return;
  }
  $("btnRecharger").classList.add("tourne");
  appel({ api:"data" }, function (r) {
    $("btnRecharger").classList.remove("tourne");
    if (r.ok && r.data) { D = r.data; rendreOnglet(); }
    else if (r.erreur) {
      if (!D) $("vAccueil").innerHTML = '<div class="etat"><b>' + ech(r.erreur) + '</b>'
        + 'Vérifiez l\'adresse et la clé en haut du fichier index.html, '
        + 'et que le déploiement est en accès « Tous les utilisateurs ».'
        + '<code>' + ech(ADRESSE) + '</code></div>';
      else flash(r.erreur, false);
    }
  });
}

function apres(r, msgOk) {
  if (!r.ok) { flash(r.erreur || "Échec", false); return false; }
  if (r.data) D = r.data;
  var m = msgOk || r.message || "Enregistré";
  if (r.mail && r.mail !== "non demandé") m += " — " + r.mail;
  flash(m, r.mail ? r.mail.indexOf("Envoyé") === 0 || r.mail === "non demandé" : true);
  return true;
}

/* ====================================================================
   NAVIGATION — onglets + pile de vues
   ==================================================================== */
var ongletActif = "accueil";
var pile = [];               /* pile de navigation à l'intérieur d'un onglet */

var TITRES = {
  accueil:{t:"",s:""}, eleves:{t:"Mes élèves",s:""},
  suivi:{t:"Mon activité",s:""}, plus:{t:"Paramètres",s:""}
};

function estMobile(){ return window.matchMedia("(max-width:819px)").matches; }

function majBarres(){
  /* surligne l'onglet courant dans la tabbar et le rail */
  document.querySelectorAll(".tabbar button, .rail .lien").forEach(function(b){
    var o = b.dataset.onglet;
    b.setAttribute("aria-current", (o === ongletActif) ? "true" : "false");
  });
}

function afficher(id, garderScroll){
  ["vAccueil","vListe","vFiche","vLecon","vFin","vPartage","vSuivi","vEleve","vChoixEval","vPlus"]
    .forEach(function(v){ $(v).classList.toggle("on", v === id); });
  if (!garderScroll) window.scrollTo(0,0);
  /* en-tête mobile : recherche visible seulement sur la liste d'élèves */
  $("zoneRecherche").hidden = (id !== "vListe");
  /* bouton retour mobile : visible dès qu'on est en profondeur */
  var profond = pile.length > 1;
  $("btnRetour").hidden = !profond;
  /* logo vs titre dans le header mobile */
  var infos = enTeteDe(id);
  var afficheTitre = !!infos.t && profond;
  $("hdLogo").hidden = afficheTitre;
  $("hdTitre").hidden = !afficheTitre;
  $("dateJour").hidden = afficheTitre;
  if (afficheTitre){ $("hdTtlTxt").textContent = infos.t; $("hdSousTxt").textContent = infos.s || ""; }
}

function enTeteDe(id){
  if (id==="vFiche" && courant){ var e=eleve(courant); return {t:e?e.nom:"Élève", s:e?e.formation:""}; }
  if (id==="vLecon") return {t:"Évaluation", s:courant||""};
  if (id==="vFin") return {t:"Séance terminée", s:courant||""};
  if (id==="vPartage") return {t:"Partager le bilan", s:courant||""};
  if (id==="vEleve") return {t:"Fiche élève", s:""};
  if (id==="vChoixEval") return {t:"Évaluer", s:"Choisir l'élève"};
  return {t:"", s:""};
}

/* empile une vue et la rend */
function pousser(id, rendu){
  pile.push({id:id, rendu:rendu});
  rendu();
  afficher(id);
}
/* remplace la vue racine de l'onglet (réinitialise la pile) */
function racine(id, rendu){
  pile = [{id:id, rendu:rendu}];
  rendu();
  afficher(id);
}
function revenir(){
  if (pile.length > 1){
    pile.pop();
    var v = pile[pile.length-1];
    v.rendu();
    afficher(v.id);
  } else {
    allerOnglet("accueil");
  }
}

function allerOnglet(o){
  ongletActif = o;
  majBarres();
  if (o === "accueil") racine("vAccueil", rendreAccueil);
  else if (o === "eleves") racine("vListe", rendreListe);
  else if (o === "evaluer") racine("vChoixEval", rendreChoixEval);
  else if (o === "suivi") racine("vSuivi", rendreSuivi);
  else if (o === "plus") racine("vPlus", rendrePlus);
}

function rendreOnglet(){ allerOnglet(ongletActif); }

/* branchements navigation */
document.querySelectorAll(".tabbar button, .rail .lien").forEach(function(b){
  b.addEventListener("click", function(){ allerOnglet(b.dataset.onglet); });
});
$("btnRetour").addEventListener("click", revenir);
$("btnRecharger").addEventListener("click", function(){ charger(); });
$("recherche").addEventListener("input", function(ev){ filtre = ev.target.value; if (D) rendreListe(); });
window.addEventListener("resize", function(){ if(D) afficher(pile.length?pile[pile.length-1].id:"vAccueil"); });
</script>

<script>
/* ====================================================================
   ACCUEIL — liste de tâches pédagogiques, pas un tableau de bord
   ==================================================================== */
function rendreAccueil(){
  var actifs = D.eleves.filter(function(e){ return e.actif; });
  var avecScore = actifs.filter(function(e){ return e.score !== null; });

  /* "prochain élève" : le plus prioritaire = plus faible score non prêt,
     sinon le dernier vu. Pas de vrai agenda dans les données, on met en avant
     l'élève qui a le plus besoin de travail. */
  var prochain = avecScore.slice().sort(function(a,b){ return a.score - b.score; })
                          .filter(function(e){ return !e.pret; })[0]
                 || avecScore.slice().sort(function(a,b){ return a.score - b.score; })[0]
                 || actifs[0];

  var derniers = actifs.slice().sort(function(a,b){
      var da = a.derniere ? a.derniere.date : "", db = b.derniere ? b.derniere.date : "";
      return db.localeCompare(da);
    }).slice(0,4);

  var h = '<div class="wrap">';
  h += '<div class="bonjour">Bonjour ' + ech(D.moniteur || "") + ' 👋</div>';
  h += '<div class="info" style="margin-top:0">' + actifs.length + ' élève'
     + (actifs.length>1?"s":"") + ' en formation</div>';

  if (prochain){
    var prio = (prochain.priorites && prochain.priorites[0]) ? prochain.priorites[0].nom : null;
    h += '<div class="hero" style="margin-top:16px">'
      + '<div class="q">À travailler en priorité</div>'
      + '<div class="n">' + ech(prochain.nom) + '</div>'
      + '<div class="h">' + ech(prochain.formation) + '</div>'
      + (prio ? '<div class="obj">🎯 <b>' + ech(prio) + '</b></div>' : '')
      + '<button class="go" onclick="ouvrirFiche(\'' + echJs(prochain.nom) + '\')">Voir l\'élève →</button>'
      + '</div>';
  }

  h += '<div class="section-tt">Mes derniers élèves</div>';
  h += derniers.length ? derniers.map(carteEleve).join("")
     : '<div class="etat"><b>Aucun élève actif</b>Créez un élève depuis l\'onglet Élèves.</div>';

  h += '<button class="btn vide" style="margin-top:6px" onclick="allerOnglet(\'eleves\')">Voir tous les élèves</button>';
  h += '</div>';
  $("vAccueil").innerHTML = h;
}

function echJs(s){ return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'"); }

/* carte élève réutilisée partout (accueil, liste, récents recherche) */
function carteEleve(e){
  var cl = (e.pret?" pret":"") + (e.actif?"":" inactif");
  var h = '<button class="carte' + cl + '" onclick="ouvrirFiche(\'' + echJs(e.nom) + '\')">'
    + '<div class="txt"><div class="nom">' + ech(e.nom) + (e.actif?"":" · archivé") + '</div>'
    + '<div class="sub">' + ech(e.formation) + '</div></div>';
  if (e.score === null){
    h += '<div class="sub" style="color:var(--pale)">— </div>'
       + '<div class="chev"></div></button>';
    return h;
  }
  h += '<div class="val"><div class="p' + (e.pret?" ok":"") + '">' + e.score
     + '<em>/100</em></div></div>'
     + '<span class="pastille ' + pastilleClasse(e) + '"></span>'
     + '<div class="chev"></div></button>';
  return h;
}

/* ====================================================================
   LISTE D'ÉLÈVES (onglet Élèves) + recherche rapide
   ==================================================================== */
function rendreListe(){
  var el = D.eleves.slice().sort(function (a,b) {
    if (a.actif !== b.actif) return a.actif ? -1 : 1;
    if (a.score === null) return 1; if (b.score === null) return -1;
    return b.score - a.score;
  });
  if (filtre) {
    var f = filtre.toLowerCase();
    el = el.filter(function(e){ return (e.nom+" "+e.formation).toLowerCase().indexOf(f) >= 0; });
  }
  var h = '<div class="wrap">';
  h += '<button class="btn noir" onclick="formEleve(null)">+ Nouvel élève</button>';

  if (!filtre){
    var recents = D.eleves.filter(function(e){return e.actif;}).slice().sort(function(a,b){
      var da=a.derniere?a.derniere.date:"", db=b.derniere?b.derniere.date:"";
      return db.localeCompare(da);
    }).slice(0,3);
    if (recents.length){
      h += '<div class="section-tt">Récents</div>';
      h += recents.map(carteEleve).join("");
      h += '<div class="section-tt">Tous les élèves</div>';
    }
  }

  h += el.length ? el.map(carteEleve).join("")
     : '<div class="etat"><b>Aucun élève</b>' + (filtre ? "Aucun résultat." : "Commencez par en créer un.") + '</div>';
  h += '<div class="pied">Objectif examen ' + D.objectif + '/100 — mis à jour le ' + ech(D.maj)
     + '\n' + D.totalLecons + ' leçon' + (D.totalLecons>1?"s":"") + ' enregistrée'
     + (D.totalLecons>1?"s":"") + ' au total</div>';
  h += '</div>';
  $("vListe").innerHTML = h;
}

/* ====================================================================
   FICHE ÉLÈVE — onglets Synthèse / Compétences / Séances / Notes
   ==================================================================== */
var ongletFiche = "synthese";

function ouvrirFiche(nom){
  courant = nom;
  ongletFiche = "synthese";
  if (!eleve(nom)){ flash("Élève introuvable.", false); return; }
  pousser("vFiche", rendreFiche);
}

function rendreFiche(){
  var e = eleve(courant);
  if (!e){ revenir(); return; }
  var h = '<div class="wrap">';

  /* bandeau retour (utile surtout desktop) */
  h += '<button class="retour" onclick="revenir()">&larr; Mes élèves</button>';

  /* en-tête nom + score */
  h += '<div class="bloc"><div class="ligne-nom" style="display:flex;gap:12px;align-items:flex-start">'
     + '<div style="flex:1;min-width:0"><div class="nom" style="font-size:20px;font-weight:800">' + ech(e.nom) + '</div>'
     + '<div class="sub" style="font-size:13px;color:var(--pale);margin-top:2px">' + ech(e.formation) + '</div></div>'
     + '<button class="crayon" onclick="formEleve(courant)" aria-label="Modifier la fiche" '
     + 'style="flex:none;width:38px;height:38px;border:1.5px solid var(--ligne);display:grid;place-items:center">'
     + '<svg viewBox="0 0 24 24" style="width:19px;height:19px;fill:none;stroke:var(--fonce);stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>'
     + '</button></div>';
  if (e.tel){
    var telBrut = String(e.tel).replace(/[^0-9+]/g,"");
    h += '<div class="contact">'
       + '<a class="lien-tel" href="tel:' + ech(telBrut) + '">'
       + '<svg viewBox="0 0 24 24"><path d="M6 3h3l1.5 5-2 1.5a11 11 0 0 0 5 5l1.5-2 5 1.5v3a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2z"/></svg>'
       + ech(e.tel) + '</a>'
       + '<a class="lien-sms" href="sms:' + ech(telBrut) + '" aria-label="SMS">'
       + '<svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 3z"/></svg></a>'
       + '</div>';
  }

  if (e.score !== null){
    h += '<div class="grand' + (e.pret?" ok":"") + '" style="margin-top:14px">' + e.score + '<em> / 100</em></div>'
       + '<div class="info" style="margin-top:0;font-weight:700;color:var(--pale);letter-spacing:.5px">PROGRESSION</div>'
       + '<div class="jauge' + (e.pret?" ok":"") + '" style="margin-top:11px"><i style="width:'
       + Math.max(2,e.score) + '%"></i><u style="left:' + D.objectif + '%"></u></div>'
       + '<div class="info">Objectif ' + D.objectif + ' · ' + e.heures + ' h · '
       + e.lecons + ' leçon' + (e.lecons>1?"s":"") + '</div>'
       + '<div class="puce' + (e.pret?" ok":"") + '">'
       + (e.pret ? "PRÊT POUR L'EXAMEN" : "ENCORE " + e.restant + " H ESTIMÉES") + '</div>';
  } else {
    h += '<div class="info" style="margin-top:12px">Aucune leçon enregistrée pour l\'instant.</div>';
  }
  h += '</div>';

  /* onglets */
  h += '<div class="onglets" role="tablist">'
     + ongletBtn("synthese","Synthèse")
     + ongletBtn("competences","Compétences")
     + ongletBtn("seances","Séances")
     + ongletBtn("notes","Notes")
     + '</div>';

  h += '<div id="ongletContenu">' + contenuOnglet(e) + '</div>';

  /* gros bouton d'action, collant en bas */
  h += '<button class="btn btn-eval" onclick="formLecon()">＋ Évaluer une séance</button>';
  h += '</div>';

  $("vFiche").innerHTML = h;
}

function ongletBtn(id,label){
  return '<button role="tab" aria-selected="' + (ongletFiche===id) + '" '
    + 'onclick="ongletFiche=\'' + id + '\';rafraichirOnglet()">' + label + '</button>';
}
function rafraichirOnglet(){
  var e = eleve(courant); if(!e) return;
  $("ongletContenu").innerHTML = contenuOnglet(e);
  document.querySelectorAll("#vFiche .onglets button").forEach(function(b){
    b.setAttribute("aria-selected", b.getAttribute("onclick").indexOf("'"+ongletFiche+"'")>=0 ? "true":"false");
  });
}

function contenuOnglet(e){
  if (e.score === null && ongletFiche !== "notes")
    return '<div class="bloc"><div class="info" style="margin:0">Enregistrez une première séance pour voir apparaître les compétences et la progression.</div></div>';
  if (ongletFiche === "synthese")    return ongSynthese(e);
  if (ongletFiche === "competences") return ongCompetences(e);
  if (ongletFiche === "seances")     return ongSeances(e);
  if (ongletFiche === "notes")       return ongNotes(e);
  return "";
}

/* ---- onglet Synthèse ---- */
function ongSynthese(e){
  var noms3 = (e.priorites||[]).map(function(p){ return p.nom; });
  var prioPrincipale = (e.priorites && e.priorites[0]) ? e.priorites[0] : null;

  var h = "";

  /* objectif prochaine séance */
  if (prioPrincipale){
    h += '<div class="cible" style="margin-bottom:9px">'
      + '<div class="tt">🎯 Objectif prochaine séance</div>'
      + '<div class="obj-nom">' + ech(prioPrincipale.nom) + '</div>'
      + '<div class="aide" style="margin-top:4px">' + ech(prioPrincipale.mot)
      + ', niveau ' + prioPrincipale.niveau + ' sur 4</div>'
      + '<div class="liste">'
      + (e.priorites||[]).map(function(p){ return '<span class="tag">' + ech(p.nom) + '</span>'; }).join("")
      + '</div></div>';
  }

  /* à travailler */
  if (e.priorites && e.priorites.length){
    h += '<div class="bloc"><div class="tt">À TRAVAILLER</div>'
      + e.priorites.map(function(p){
          var c = p.niveau<=1 ? "r" : (p.niveau<=2 ? "o" : "o");
          return '<div class="critere"><span class="rd ' + c + '"></span>'
               + '<span class="cn">' + ech(p.nom) + '<div class="cm">' + ech(p.mot) + '</div></span>'
               + '<span class="cv">' + p.niveau + '/4</span></div>'; }).join("")
      + '</div>';
  }

  /* points forts */
  var forts = [];
  e.niveaux.forEach(function(n,k){ if (n>=4 && noms3.indexOf(COMP[k])<0) forts.push(COMP[k]); });
  if (forts.length){
    h += '<div class="bloc"><div class="tt">POINTS FORTS</div>'
      + forts.slice(0,5).map(function(c){
          return '<div class="critere"><span class="rd v"></span>'
               + '<span class="cn">' + ech(c) + '</span>'
               + '<span class="cv" style="color:var(--vert)">acquis</span></div>'; }).join("")
      + '</div>';
  }
  return h;
}

/* ---- onglet Compétences (détail par famille) ---- */
function ongCompetences(e){
  var noms3 = (e.priorites||[]).map(function(p){ return p.nom; });
  var h = '<div class="bloc">';
  FAMILLES.forEach(function(fam){
    h += '<div class="groupe-tt">' + ech(fam.nom) + '</div>';
    fam.idx.forEach(function(k){
      var n = e.niveaux[k];
      var cls = n>=4 ? " acquise" : (noms3.indexOf(COMP[k])>=0 ? " faible" : "");
      h += '<div class="comp' + cls + '"><div class="l"><span>' + ech(COMP[k])
         + '<small>' + (D.mots[n]||"") + '</small></span><b>' + n + '/4</b></div>'
         + '<div class="b"><i style="width:' + (n/4*100) + '%"></i></div></div>';
    });
  });
  h += '</div>';
  return h;
}

/* ---- onglet Séances (chronologie + progression) ---- */
function ongSeances(e){
  var h = '<div class="bloc"><div class="tt">PROGRESSION</div>' + courbeSvg(e.courbe)
     + '<div class="suite">' + e.courbe.join(" › ") + '</div>'
     + '<div class="aide">De la première leçon, à gauche, à la plus récente, à droite.</div></div>';

  h += '<div class="bloc"><div class="tt">HISTORIQUE DES LEÇONS</div>'
    + '<div class="aide" style="margin:-6px 0 10px">De la plus récente à la plus ancienne. '
    + 'Le nombre à gauche est le score atteint après cette leçon.</div>'
    + e.historique.map(function(l){
        return '<div class="histo"><div class="sc">' + l.score + '</div><div>'
             + '<div class="d">' + ech(l.date) + ' · ' + l.duree + ' h</div>'
             + '<div class="t">' + ech(l.theme || "—") + '</div>'
             + (l.comm ? '<div class="mot">' + ech(l.comm) + '</div>' : '')
             + '</div></div>'; }).join("")
    + '</div>';
  return h;
}

/* ---- onglet Notes + envoi e-mail ---- */
function ongNotes(e){
  var h = '<div class="bloc"><div class="tt">NOTE DE SUIVI</div>'
    + '<div id="noteLecture">'
    +   (e.note ? '<div class="note-suivi">' + ech(e.note) + '</div>'
              : '<div class="note-vide">Aucune note pour cet élève.</div>')
    +   '<button class="btn vide" style="margin-top:11px" onclick="editerNote()">'
    +   (e.note ? 'Modifier la note' : 'Ajouter une note') + '</button>'
    + '</div>'
    + '<div id="noteEdition" hidden>'
    +   '<textarea id="nTxt" maxlength="800">' + ech(e.note) + '</textarea>'
    +   '<div class="aide">Note interne. Elle n\'est jamais envoyée à l\'élève.</div>'
    +   '<button class="btn" style="margin-top:10px" onclick="sauverNote()">Enregistrer la note</button>'
    +   '<button class="btn vide" onclick="rafraichirOnglet()">Annuler</button>'
    + '</div></div>';

  if (e.score !== null && (e.email || e.email2)){
    h += '<div class="bloc"><div class="tt">ENVOYER PAR E-MAIL</div>'
      + '<div class="aide" style="margin:-6px 0 10px">Choisissez le ou les destinataires, '
      + 'puis ce que vous voulez leur envoyer.</div>'
      + blocDest(e, "f")
      + '<button class="btn vide" style="margin-top:8px" onclick="renvoyer()">Le dernier score</button>'
      + '<button class="btn vide" onclick="envoyerBilan()">Le bilan complet</button>'
      + '<div class="aide">Le bilan reprend toutes les leçons, les dates, les durées, '
      + 'les commentaires et la progression.</div></div>';
  }

  if (e.score !== null){
    h += '<button class="btn vide" onclick="ouvrirPartage()">Aperçu du bilan à partager</button>';
  }
  return h;
}

function editerNote(){ $("noteLecture").hidden = true; $("noteEdition").hidden = false; $("nTxt").focus(); }

function courbeSvg(c) {
  if (!c || c.length < 2) return '<div class="aide" style="margin:0">Au moins deux leçons sont nécessaires pour tracer la courbe.</div>';
  var L = 300, H = 74, m = 5;
  var pts = c.map(function(v,i){
    var x = m + i*(L-2*m)/(c.length-1);
    var y = H - 6 - (v/100)*(H-13);
    return x.toFixed(1)+","+y.toFixed(1);
  });
  var ys = H - 6 - (D.objectif/100)*(H-13);
  var d = pts[pts.length-1].split(",");
  return '<svg class="courbe" viewBox="0 0 '+L+' '+H+'" preserveAspectRatio="none">'
    + '<line x1="0" y1="'+ys.toFixed(1)+'" x2="'+L+'" y2="'+ys.toFixed(1)+'" stroke="#0B0A09" stroke-width="1" stroke-dasharray="4 4"/>'
    + '<polyline points="'+pts.join(" ")+'" fill="none" stroke="#F26522" stroke-width="3" '
    + 'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="'+d[0]+'" cy="'+d[1]+'" r="4" fill="#0B0A09"/></svg>';
}
</script>

<script>
/* ====================================================================
   ONGLET ÉVALUER — d'abord choisir l'élève
   ==================================================================== */
function rendreChoixEval(){
  var actifs = D.eleves.filter(function(e){ return e.actif; }).sort(function(a,b){
    var da=a.derniere?a.derniere.date:"", db=b.derniere?b.derniere.date:"";
    return db.localeCompare(da);
  });
  var h = '<div class="wrap">';
  h += '<div class="bonjour" style="font-size:20px">Évaluer une séance</div>';
  h += '<div class="info" style="margin-top:0">Choisissez l\'élève que vous venez de faire rouler.</div>';
  h += '<div style="margin-top:14px">';
  h += actifs.length ? actifs.map(carteEleve).join("")
     : '<div class="etat"><b>Aucun élève actif</b>Créez d\'abord un élève.</div>';
  h += '</div></div>';
  $("vChoixEval").innerHTML = h;
}

/* ====================================================================
   ÉVALUATION D'UNE SÉANCE — évaluation rapide, gros boutons pouce
   Compatible back-end : on envoie toujours 9 valeurs (null = non abordé).
   ==================================================================== */
/* notes[k] : entier 1..4 = niveau attribué ce jour ; "skip" = non évalué ce jour
   (choix explicite) ; null = pas encore touché. "skip" et null gardent le
   niveau précédent côté serveur (envoyés comme chaîne vide). */
var saisie = { duree: 1, notes: [null,null,null,null,null,null,null,null,null] };
var scoreAvant = null;

function formLecon(){
  var e = eleve(courant); if (!e) return;
  scoreAvant = e.score;
  saisie = { duree: 1, notes: [null,null,null,null,null,null,null,null,null] };
  rendreFormLecon(e);
  pousser("vLecon", function(){ rendreFormLecon(eleve(courant)); });
}

function rendreFormLecon(e){
  var h = '<div class="wrap">';
  h += '<button class="retour" onclick="revenir()">&larr; ' + ech(e.nom) + '</button>';

  h += '<div class="bloc"><div class="tt">SÉANCE — ' + ech(e.nom).toUpperCase() + '</div>'
    + '<label>Date</label><input type="date" id="lDate" value="' + auj() + '">'
    + '<label>Durée</label><div class="chips" id="lDuree">'
    +   ['0.75|45 min','1|1 h','1.5|1 h 30','2|2 h'].map(function(x,i){
          var p = x.split("|");
          return '<button class="chip" data-v="'+p[0]+'" aria-pressed="'+(i===1)+'">'+p[1]+'</button>'; }).join("")
    + '</div>'
    + '<label>Thème travaillé</label>'
    + '<input type="text" id="lTheme" placeholder="Ronds-points de la rocade" value="'+ ech(themeSuggere(e)) +'">'
    + '<label>Commentaire pour l\'élève</label>'
    + '<textarea id="lComm" maxlength="400" placeholder="Bien meilleure observation aux intersections. On reverra le créneau la prochaine fois."></textarea>'
    + '<div class="aide">Facultatif. Ce commentaire figure dans l\'e-mail, sous « Le mot d\'Olivier ».</div>'
    + '</div>';

  h += '<div class="section-tt" style="margin-top:18px">Compétences</div>'
     + '<div class="info" style="margin:-4px 2px 12px">Notez ce que vous avez vu aujourd\'hui. '
     + 'Une compétence laissée telle quelle garde son niveau précédent.</div>';

  h += '<div id="listeEval">'
     + COMP.map(function(c,k){ return blocEval(e,k); }).join("")
     + '</div>';

  h += '<div class="bloc"><div class="tt">ENVOYER LE SCORE APRÈS ENREGISTREMENT</div>'
    + '<div class="aide" style="margin:-6px 0 10px">Cochez qui doit recevoir le score. '
    + 'Décochez tout pour n\'envoyer aucun e-mail.</div>'
    + blocDest(e, "l") + '</div>';

  h += '<button class="btn" onclick="enregistrerLecon()">Enregistrer la séance</button>'
    + '<button class="btn vide" onclick="revenir()">Annuler</button>';
  h += '</div>';

  $("vLecon").innerHTML = h;

  $("lDuree").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if(!b) return;
    this.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
    b.setAttribute("aria-pressed","true"); saisie.duree = parseFloat(b.dataset.v);
  });
  brancherEval();
}

function themeSuggere(e){
  return (e.priorites && e.priorites[0]) ? e.priorites[0].nom : "";
}

/* un bloc d'évaluation gros boutons pour la compétence d'indice k */
function blocEval(e,k){
  var actuel = e.niveaux[k];
  var val = saisie.notes[k];
  var rempli = (val!=null && val!=="skip");
  var boutons = [
    {n:1, em:"❌", l:"À revoir"},
    {n:2, em:"🟠", l:"À améliorer"},
    {n:3, em:"🟢", l:"Acquis"},
    {n:4, em:"⭐", l:"Maîtrisé"}
  ];
  return '<div class="eval-comp' + (rempli?" rempli":"") + (val==="skip"?" saute":"") + '" data-k="'+k+'">'
    + '<div class="cn">' + ech(COMP[k]) + '</div>'
    + '<div class="ca">Niveau actuel : ' + actuel + '/4 · ' + (MOTS[actuel]||"") + '</div>'
    + '<div class="eval-grille">'
    + boutons.map(function(b){
        return '<button class="n'+b.n+'" data-n="'+b.n+'" aria-pressed="'+(val===b.n)+'">'
             + '<span class="em">'+b.em+'</span>'+b.l+'</button>';
      }).join("")
    + '</div>'
    + '<button class="skip" data-n="skip" aria-pressed="'+(val==="skip")+'">Non évalué ce jour</button>'
    + '</div>';
}

/* mise à jour IN-PLACE : on ne remplace jamais le noeud ni la liste,
   on ne fait que basculer les attributs. Aucun scroll déclenché. */
function majBlocEval(bloc, k){
  var val = saisie.notes[k];
  var rempli = (val!=null && val!=="skip");
  bloc.classList.toggle("rempli", rempli);
  bloc.classList.toggle("saute", val==="skip");
  bloc.querySelectorAll(".eval-grille button").forEach(function(x){
    x.setAttribute("aria-pressed", (saisie.notes[k] === parseInt(x.dataset.n,10)) ? "true":"false");
  });
  var s = bloc.querySelector("button.skip");
  if (s) s.setAttribute("aria-pressed", (val==="skip") ? "true":"false");
}

function brancherEval(){
  $("listeEval").querySelectorAll(".eval-comp").forEach(function(bloc){
    var k = parseInt(bloc.dataset.k,10);
    bloc.addEventListener("click", function(ev){
      var b = ev.target.closest("button"); if(!b) return;
      if (b.dataset.n === "skip"){
        saisie.notes[k] = (saisie.notes[k] === "skip") ? null : "skip";
      } else if (b.dataset.n){
        var n = parseInt(b.dataset.n,10);
        saisie.notes[k] = (saisie.notes[k] === n) ? null : n;  /* re-clic annule */
      } else return;
      majBlocEval(bloc, k);   /* in-place, pas de re-render */
    });
  });
}

function enregistrerLecon(){
  var theme = $("lTheme").value.trim();
  if (!theme) { flash("Indiquez le thème travaillé.", false); $("lTheme").focus(); return; }
  var aEvalue = saisie.notes.some(function(n){ return n!=null && n!=="skip"; });
  if (!aEvalue && !confirm("Aucune compétence notée. Enregistrer quand même la séance ?")) return;
  var dst = litDest("l");
  attente(true, "Enregistrement de la séance…");
  appel({
    api   : "lecon",
    eleve : courant,
    date  : $("lDate").value,
    duree : saisie.duree,
    theme : theme,
    comm  : $("lComm").value.trim(),
    /* "skip" et null -> chaîne vide : le serveur conserve le niveau précédent */
    notes : saisie.notes.map(function(n){ return (n === null || n === "skip") ? "" : n; }).join(","),
    mail  : (dst.dEleve || dst.dParent) ? 1 : 0,
    dEleve: dst.dEleve,
    dParent: dst.dParent
  }, function (r) {
    if (apres(r)) {
      pile.pop();
      ouvrirFin();
    }
  });
}

/* ====================================================================
   ÉCRAN FIN DE SÉANCE
   ==================================================================== */
function ouvrirFin(){
  pousser("vFin", rendreFin);
}
function rendreFin(){
  var e = eleve(courant);
  if (!e){ allerOnglet("accueil"); return; }
  var delta = (scoreAvant==null) ? e.score : (e.score - scoreAvant);
  var signe = delta>0 ? "+" : (delta<0 ? "" : "±");
  var clsDelta = delta>0 ? "" : (delta<0 ? " neg" : " nul");

  /* progrès = compétences qu'on vient de monter ; à surveiller = priorités restantes */
  var montees = [];
  saisie.notes.forEach(function(n,k){
    if (n!=null && scoreAvant!=null && n >= 3) montees.push(COMP[k]);
    else if (n!=null && n>=3) montees.push(COMP[k]);
  });
  montees = montees.filter(function(v,i,a){ return a.indexOf(v)===i; }).slice(0,3);
  var surveiller = (e.priorites||[]).slice(0,2).map(function(p){ return p.nom; });
  var prio = (e.priorites && e.priorites[0]) ? e.priorites[0].nom : null;

  var h = '<div class="fin-wrap">';
  h += '<div class="fin-tt">Séance terminée ✓</div>';
  h += '<div class="fin-nom">' + ech(e.nom) + '</div>';

  h += '<div class="delta"><div class="g' + clsDelta + '">' + signe + Math.abs(delta) + '</div>'
     + '<div class="l">'+(scoreAvant==null?"Premier score":"points de progression")+'</div>'
     + '<div class="sc">Score total : <b>' + e.score + ' / 100</b></div></div>';

  if (montees.length){
    h += '<div class="rub p"><div class="h">🟢 Progrès</div>'
       + montees.map(function(c){ return '<div class="item">'+ech(c)+'</div>'; }).join("") + '</div>';
  }
  if (surveiller.length){
    h += '<div class="rub s"><div class="h">🟠 À surveiller</div>'
       + surveiller.map(function(c){ return '<div class="item">'+ech(c)+'</div>'; }).join("") + '</div>';
  }
  if (prio){
    h += '<div class="rub c"><div class="h">🎯 Prochaine priorité</div>'
       + '<div class="item">'+ech(prio)+'</div></div>';
  }

  h += '<button class="btn" onclick="ouvrirPartage()">Partager le bilan avec l\'élève</button>';
  h += '<button class="btn vide" onclick="terminerSeance()">Terminer</button>';
  h += '</div>';
  $("vFin").innerHTML = h;
}
function terminerSeance(){
  /* retour à la fiche de l'élève */
  ongletActif = "eleves"; majBarres();
  pile = [{id:"vListe", rendu:rendreListe}];
  ouvrirFiche(courant);
}

/* ====================================================================
   PARTAGE DU BILAN (aperçu + canaux)
   ==================================================================== */
function ouvrirPartage(){ pousser("vPartage", rendrePartage); }

function rendrePartage(){
  var e = eleve(courant);
  if (!e){ revenir(); return; }
  var noms3 = (e.priorites||[]).map(function(p){ return p.nom; });
  var forts = [];
  e.niveaux.forEach(function(n,k){ if (n>=4 && noms3.indexOf(COMP[k])<0) forts.push(COMP[k]); });
  var prio = (e.priorites && e.priorites[0]) ? e.priorites[0].nom : null;
  var dateTxt = e.derniere ? e.derniere.date : auj();

  var h = '<div class="fin-wrap">';
  h += '<button class="retour" onclick="revenir()">&larr; Retour</button>';

  h += '<div class="share-card">'
    + '<div class="share-head"><div class="k">🚗 PERMIS SCORE</div>'
    + '<div class="n">' + ech(e.nom) + '</div>'
    + '<div class="d">' + ech(e.formation) + ' · séance du ' + ech(dateTxt) + '</div></div>'
    + '<div class="share-body">'
    + '<div class="s-tt">Votre progression</div>'
    + '<div class="share-pts">' + e.score + '<span style="font-size:16px;color:var(--pale)"> / 100</span></div>'
    + '<div class="jauge" style="margin-top:10px"><i style="width:'+Math.max(2,e.score)+'%"></i>'
    + '<u style="left:'+D.objectif+'%"></u></div>';

  if (forts.length){
    h += '<div class="s-tt">✓ Points forts</div>'
       + forts.slice(0,3).map(function(c){ return '<div class="share-li">'+ech(c)+'</div>'; }).join("");
  }
  if (prio){
    h += '<div class="s-tt">🎯 À travailler</div><div class="share-li">'+ech(prio)+'</div>';
  }
  h += '</div></div>';

  h += '<div class="aide" style="text-align:center;margin-bottom:10px">Choisissez comment envoyer ce bilan.</div>';
  h += '<div class="canaux">'
    + '<button class="btn noir" onclick="partagerTexte()">Copier / Partager</button>'
    + '<button class="btn" onclick="partagerWhatsApp()">WhatsApp</button>'
    + '</div>';
  if (e.email || e.email2){
    h += '<button class="btn vide" style="margin-top:8px" onclick="renvoyer()">Envoyer par e-mail</button>';
  }
  h += '</div>';
  $("vPartage").innerHTML = h;
}

function jaugeTexte(n){
  var pleins = "▰▰▰▰".slice(0,n);
  var vides = "▱▱▱▱".slice(0, 4-n);
  return pleins + vides;
}
function texteBilan(){
  var e = eleve(courant);
  var noms3 = (e.priorites||[]).map(function(p){ return p.nom; });
  var forts = [];
  e.niveaux.forEach(function(n,k){ if (n>=4 && noms3.indexOf(COMP[k])<0) forts.push(COMP[k]); });
  var prio = (e.priorites && e.priorites[0]) ? e.priorites[0].nom : null;

  var t = "🚗 *PERMIS SCORE — Olive Conduite*\n"
        + e.nom + " · " + e.formation + "\n"
        + "Séance du " + (e.derniere?e.derniere.date:auj()) + "\n\n"
        + "*Progression : " + e.score + "/100*  (objectif " + D.objectif + ")\n"
        + jaugeTexte(Math.round(e.score/25)) + "\n\n";

  /* tableau des compétences, une ligne par compétence */
  t += "*Compétences*\n";
  COMP.forEach(function(c,k){
    var n = e.niveaux[k];
    t += jaugeTexte(n) + " " + c + " (" + n + "/4)\n";
  });

  if (forts.length) t += "\n✓ *Points forts* : " + forts.slice(0,3).join(", ") + "\n";
  if (prio) t += "🎯 *À travailler* : " + prio + "\n";
  t += "\nÀ bientôt sur la route !";
  return t;
}
function partagerTexte(){
  var t = texteBilan();
  if (navigator.share){
    navigator.share({ title:"Permis Score — "+courant, text:t }).catch(function(){});
  } else if (navigator.clipboard){
    navigator.clipboard.writeText(t).then(function(){ flash("Bilan copié dans le presse-papiers.", true); },
      function(){ flash("Copie impossible.", false); });
  } else {
    flash("Partage non disponible sur cet appareil.", false);
  }
}
function partagerWhatsApp(){
  window.open("https://wa.me/?text=" + encodeURIComponent(texteBilan()), "_blank");
}

/* ====================================================================
   ONGLET SUIVI — activité globale de l'école
   ==================================================================== */
function rendreSuivi(){
  var actifs = D.eleves.filter(function(e){ return e.actif; });
  var avec = actifs.filter(function(e){ return e.score!=null; });
  var prets = avec.filter(function(e){ return e.pret; }).length;
  var moyenne = avec.length ? Math.round(avec.reduce(function(a,e){return a+e.score;},0)/avec.length) : 0;
  var heures = actifs.reduce(function(a,e){ return a + (e.heures||0); }, 0);

  var h = '<div class="wrap">';
  h += '<div class="bonjour" style="font-size:20px">Mon activité</div>';

  h += '<div class="bloc" style="display:flex;gap:10px;text-align:center">'
    + statCase(actifs.length, "élèves actifs")
    + statCase(prets, "prêts examen")
    + statCase(moyenne, "score moyen")
    + '</div>';

  h += '<div class="bloc"><div class="tt">VOLUME</div>'
    + '<div class="info" style="margin:0">' + Math.round(heures) + ' h de conduite cumulées · '
    + D.totalLecons + ' leçon' + (D.totalLecons>1?"s":"") + ' au total.</div></div>';

  /* prêts pour l'examen */
  var listePrets = avec.filter(function(e){ return e.pret; });
  if (listePrets.length){
    h += '<div class="section-tt">Prêts pour l\'examen</div>'
       + listePrets.map(carteEleve).join("");
  }

  /* à surveiller : proches du but mais pas prêts */
  var proches = avec.filter(function(e){ return !e.pret && e.restant<=4; })
                    .sort(function(a,b){ return a.restant-b.restant; });
  if (proches.length){
    h += '<div class="section-tt">Bientôt prêts</div>'
       + proches.map(carteEleve).join("");
  }
  h += '</div>';
  $("vSuivi").innerHTML = h;
}
function statCase(val,lab){
  return '<div style="flex:1"><div style="font-size:26px;font-weight:800;color:var(--fonce);font-variant-numeric:tabular-nums">'
    + val + '</div><div style="font-size:11px;color:var(--pale);font-weight:600">'+lab+'</div></div>';
}

/* ====================================================================
   ONGLET PLUS / PARAMÈTRES
   ==================================================================== */
function rendrePlus(){
  var h = '<div class="wrap">';
  h += '<div class="bonjour" style="font-size:20px">Paramètres</div>';
  h += '<div class="bloc"><div class="tt">ÉCOLE</div>'
    + '<div class="info" style="margin:0"><b>' + ech(D.ecole||"Olive Conduite") + '</b><br>'
    + 'Moniteur : ' + ech(D.moniteur||"—") + '<br>'
    + 'Objectif examen : ' + D.objectif + '/100<br>'
    + 'Dernière mise à jour : ' + ech(D.maj) + '</div></div>';

  h += '<div class="bloc"><div class="tt">DONNÉES</div>'
    + '<button class="btn vide" onclick="charger()">Recharger depuis le tableur</button>'
    + '<div class="aide">Les données sont stockées dans votre feuille Google. '
    + 'L\'application fonctionne hors-ligne et affiche les dernières données connues.</div></div>';

  if (DEMO){
    h += '<div class="bloc"><div class="tt">MODE</div>'
      + '<div class="info" style="margin:0">Vous êtes en mode démonstration. '
      + 'Renseignez l\'adresse et la clé en haut du fichier index.html pour connecter votre tableur.</div></div>';
  }

  h += '<div class="pied">Permis Score · Olive Conduite\n'
    + D.eleves.length + ' élève' + (D.eleves.length>1?"s":"") + ' au fichier</div>';
  h += '</div>';
  $("vPlus").innerHTML = h;
}

/* ====================================================================
   FORMULAIRE ÉLÈVE (création / modification)
   ==================================================================== */
function formEleve(nom) {
  var e = nom ? eleve(nom) : { nom:"", email:"", email2:"", formation:"", actif:true, score:null };
  var nouveau = !nom;
  var h = '<div class="wrap">';
  h += '<button class="retour" onclick="revenir()">&larr; Retour</button>';
  h += '<div class="bloc"><div class="tt">' + (nouveau ? "NOUVEL ÉLÈVE" : "MODIFIER LA FICHE") + '</div>'
    + '<label>Prénom et nom</label><input type="text" id="eNom" value="' + ech(e.nom) + '" placeholder="Lola G.">'
    + '<label>Téléphone</label><input type="tel" id="eTel" value="' + ech(e.tel || "") + '" placeholder="06 12 34 56 78" inputmode="tel">'
    + '<label>Adresse e-mail</label><input type="email" id="eMail" value="' + ech(e.email) + '" placeholder="prenom@exemple.fr">'
    + '<label>E-mail du parent ou du tuteur</label>'
    + '<input type="email" id="eMail2" value="' + ech(e.email2 || "") + '" placeholder="facultatif">'
    + '<div class="aide">Renseignée, cette adresse reçoit une copie de chaque score et du bilan complet.</div>'
    + '<label>Formation</label>'
    + '<select id="eForm">'
    +   PACKS.map(function(x){
          return '<option value="' + ech(x) + '"' + (x === e.formation ? ' selected' : '') + '>'
               + ech(x) + '</option>'; }).join("")
    +   '<option value="__autre"' + ((e.formation && PACKS.indexOf(e.formation) < 0) ? ' selected' : '')
    +   '>Autre, à saisir</option>'
    + '</select>'
    + '<input type="text" id="eFormAutre" placeholder="Intitulé de la formation" value="'
    +   ((e.formation && PACKS.indexOf(e.formation) < 0) ? ech(e.formation) : '') + '"'
    +   ((e.formation && PACKS.indexOf(e.formation) < 0) ? '' : ' hidden') + ' style="margin-top:8px">'
    + '</div>'
    + '<button class="btn" onclick="sauverEleve(' + (nouveau ? 'null' : 'true') + ')">Enregistrer</button>';
  if (!nouveau) {
    h += '<button class="btn danger" onclick="archiver(' + (e.actif ? 0 : 1) + ')">'
       + (e.actif ? "Archiver cet élève" : "Réactiver cet élève") + '</button>';
    h += '<div class="info" style="text-align:center">L\'archivage conserve toutes les leçons.</div>';
  }
  h += '</div>';

  pousser("vEleve", function(){ $("vEleve").innerHTML = h; brancherFormEleve(); });
}

function brancherFormEleve(){
  var sel = $("eForm"); if(!sel) return;
  sel.addEventListener("change", function(){
    $("eFormAutre").hidden = (this.value !== "__autre");
    if (this.value === "__autre") $("eFormAutre").focus();
  });
}

function formationChoisie() {
  var v = $("eForm").value;
  return v === "__autre" ? $("eFormAutre").value.trim() : v;
}

function sauverEleve(modif) {
  var nom = $("eNom").value.trim();
  if (!nom) { flash("Le nom est obligatoire.", false); return; }
  attente(true, "Enregistrement…");
  if (modif) {
    var e = eleve(courant);
    appel({ api:"eleveUpd", ancien: courant, nom: nom, tel: $("eTel").value.trim(),
            email: $("eMail").value.trim(), email2: $("eMail2").value.trim(),
            formation: formationChoisie(), actif: e.actif ? 1 : 0 },
      function (r) { if (apres(r)) { courant = nom; pile.pop(); ouvrirFiche(nom); } });
  } else {
    appel({ api:"eleveAdd", nom: nom, tel: $("eTel").value.trim(), email: $("eMail").value.trim(),
            email2: $("eMail2").value.trim(), formation: formationChoisie() },
      function (r) { if (apres(r)) { courant = nom; pile.pop(); ouvrirFiche(nom); } });
  }
}

function archiver(actif) {
  attente(true, "Enregistrement…");
  appel({ api:"eleveArch", nom: courant, actif: actif },
    function (r) { if (apres(r)) { pile.pop(); allerOnglet("eleves"); } });
}

/* ---- note & e-mails (inchangés côté serveur) ---- */
function sauverNote() {
  attente(true, "Enregistrement de la note…");
  appel({ api:"note", eleve: courant, note: $("nTxt").value.trim() },
    function (r) { if (apres(r)) rafraichirOnglet(); });
}
function envoyerBilan() {
  var e = eleve(courant), d = litDest("f");
  if (!d.dEleve && !d.dParent) { flash("Cochez au moins un destinataire.", false); return; }
  var qui = [];
  if (d.dEleve) qui.push(e.email);
  if (d.dParent) qui.push(e.email2);
  if (!confirm("Envoyer le bilan complet de " + e.lecons + " leçon"
      + (e.lecons > 1 ? "s" : "") + " à " + qui.join(" et ") + " ?")) return;
  attente(true, "Préparation du bilan…");
  appel({ api:"bilan", eleve: courant, dEleve: d.dEleve, dParent: d.dParent }, function (r) {
    attente(false);
    if (r.data) D = r.data;
    flash(r.message || r.erreur || "—", !!r.ok);
    rafraichirOnglet();
  });
}
function renvoyer() {
  var e = eleve(courant), d = litDest("f");
  /* si les cases n'existent pas (écran partage), on envoie à l'élève par défaut */
  if (!$("fEleve") && !$("fParent")) { d = { dEleve: e.email?1:0, dParent:(e.email2&&!e.email)?1:0 }; }
  if (!d.dEleve && !d.dParent) { flash("Cochez au moins un destinataire.", false); return; }
  attente(true, "Envoi de l'e-mail…");
  appel({ api:"mail", eleve: courant, dEleve: d.dEleve, dParent: d.dParent }, function (r) {
    attente(false);
    if (r.data) D = r.data;
    flash(r.message || r.erreur || "—", !!r.ok);
  });
}
</script>
