<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Permis Score — Olive Conduite</title>
<meta name="theme-color" content="#0B0A09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Permis Score">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">

<style>
:root{
  --noir:#0B0A09; --orange:#F26522; --fonce:#BF4A12;
  --papier:#F7F5F2; --blanc:#fff; --ligne:#E2DDD6;
  --texte:#141210; --doux:#5C5651; --pale:#8A847C;
  --vert:#1E7A34; --rouge:#C4321A;
  --haut:env(safe-area-inset-top); --bas:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--papier);color:var(--texte);overscroll-behavior-y:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}

header{position:sticky;top:0;z-index:30;background:var(--noir);color:#fff;
  padding:calc(11px + var(--haut)) 16px 11px}
.hd{display:flex;align-items:center;gap:12px}
.marque{font-size:18px;font-weight:800;letter-spacing:.5px;line-height:1}
.marque span{color:var(--orange)}
.sous{font-size:11px;color:#a9a39b;margin-top:3px}
.ico{margin-left:auto;width:36px;height:36px;border:1px solid #33302c;display:grid;place-items:center;flex:none}
.ico svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ico.tourne svg{animation:tr .9s linear infinite}
@keyframes tr{to{transform:rotate(360deg)}}
.chercher{margin-top:11px;position:relative}
.chercher input{width:100%;background:#1a1815;border:1px solid #33302c;color:#fff;
  padding:10px 12px 10px 36px;font-size:16px}
.chercher input::placeholder{color:#7d7770}
.chercher svg{position:absolute;left:11px;top:11px;width:16px;height:16px;fill:none;stroke:#7d7770;stroke-width:2}

main{padding:13px 13px calc(30px + var(--bas))}
.vue{display:none}
.vue.on{display:block;animation:ap .16s ease-out}
@keyframes ap{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.bandeau{padding:9px 13px;font-size:13px;font-weight:600;text-align:center}
.bandeau.demo{background:var(--orange);color:#140800}
.bandeau.ok{background:#D7F0DB;color:#14532A}
.bandeau.ko{background:#FFE0DA;color:#8C1C0A}

.carte{display:block;width:100%;text-align:left;background:var(--blanc);border:1px solid var(--ligne);
  border-left:5px solid var(--orange);padding:13px 15px;margin-bottom:9px}
.carte:active{background:#FFF7F2}
.carte.pret{border-left-color:var(--vert)}
.carte.inactif{opacity:.5}
.nom{font-size:17px;font-weight:700;line-height:1.2}
.ligne-nom{display:flex;align-items:flex-start;gap:12px}
.ligne-nom > div{flex:1;min-width:0}
.form.manque{color:var(--rouge);font-weight:600}
.crayon{flex:none;width:38px;height:38px;border:1.5px solid var(--ligne);display:grid;place-items:center}
.crayon svg{width:19px;height:19px;fill:none;stroke:var(--fonce);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.crayon:active{background:#FFF4EE;border-color:var(--orange)}
.form{font-size:12px;color:var(--pale);margin-top:2px}
.rang{display:flex;align-items:center;gap:11px;margin-top:10px}
.pts{font-size:29px;font-weight:800;color:var(--fonce);line-height:1;min-width:74px;font-variant-numeric:tabular-nums}
.pts em{font-size:12px;color:var(--pale);font-style:normal;font-weight:400}
.pts.ok{color:var(--vert)}
.jauge{flex:1;background:var(--ligne);height:10px;position:relative}
.jauge i{display:block;height:100%;background:var(--orange);transition:width .3s}
.jauge.ok i{background:var(--vert)}
.jauge u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--noir)}
.info{font-size:12px;color:var(--doux);margin-top:8px}
.puce{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;padding:4px 9px;
  background:#EFEBE5;color:var(--doux);margin-top:8px}
.puce.ok{background:var(--vert);color:#fff}
.puce.urgent{background:#FFE8DE;color:var(--fonce)}

.bloc{background:var(--blanc);border:1px solid var(--ligne);padding:15px;margin-bottom:9px}
.tt{font-size:10.5px;font-weight:800;letter-spacing:1.2px;color:var(--fonce);margin-bottom:11px}
.grand{font-size:54px;font-weight:800;color:var(--fonce);line-height:.92;font-variant-numeric:tabular-nums}
.grand.ok{color:var(--vert)}
.grand em{font-size:18px;color:var(--pale);font-style:normal;font-weight:400}
.retour{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--fonce);font-weight:600;padding:5px 0 11px}

.comp{margin-bottom:10px}
.comp:last-child{margin-bottom:0}
.comp .l{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:4px}
.comp .l small{color:var(--pale);font-size:11.5px;margin-left:6px}
.comp .b{background:#EFEBE5;height:9px}
.comp .b i{display:block;height:100%;background:var(--orange)}
.comp.faible .b i{background:var(--rouge)}
.comp.acquise .b i{background:var(--vert)}
.prio{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--ligne)}
.prio:last-child{border-bottom:none}
.prio b{width:21px;height:21px;flex:none;background:var(--rouge);color:#fff;font-size:12px;display:grid;place-items:center}
.prio small{display:block;color:var(--pale);font-size:12px}
.courbe{width:100%;height:74px;display:block}
.suite{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--doux);margin-top:6px}

.histo{border-top:1px solid var(--ligne);padding:10px 0;display:flex;gap:12px;align-items:flex-start}
.histo:first-of-type{border-top:none}
.histo .sc{font-size:19px;font-weight:800;color:var(--fonce);min-width:44px;font-variant-numeric:tabular-nums}
.histo .d{font-size:13.5px;font-weight:600}
.histo .t{font-size:12.5px;color:var(--doux)}

.btn{display:block;width:100%;text-align:center;background:var(--orange);color:#140800;
  font-weight:800;font-size:16px;letter-spacing:.3px;padding:14px;border:2px solid var(--orange);margin-bottom:9px}
.btn:active{background:#FF7A38}
.btn.noir{background:var(--noir);border-color:var(--noir);color:#fff}
.btn.vide{background:transparent;color:var(--texte);border-color:var(--ligne)}
.btn.danger{background:transparent;color:var(--rouge);border-color:#F0CFC8}
.btn[disabled]{opacity:.5}

label{display:block;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--fonce);margin:14px 0 5px}
input[type=text],input[type=email],input[type=date],textarea{width:100%;background:#fff;
  border:1px solid var(--ligne);padding:12px;font-size:16px}
input:focus,textarea:focus{outline:none;border-color:var(--orange)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;min-width:64px;text-align:center;border:1.5px solid var(--ligne);background:#fff;padding:11px 6px;font-size:14px;font-weight:600}
.chip[aria-pressed=true]{border-color:var(--orange);background:#FFF4EE;color:var(--fonce)}
.note-l{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin:14px 0 5px}
.note-l small{color:var(--pale);font-size:11.5px}
.niv{display:flex;gap:5px}
.niv button{flex:1;border:1.5px solid var(--ligne);background:#fff;padding:11px 0;font-size:15px;font-weight:700}
.niv button[aria-pressed=true]{border-color:var(--orange);background:var(--orange);color:#140800}
.niv button.zero[aria-pressed=true]{background:#EFEBE5;border-color:#c9c3bb;color:var(--doux)}
.bascule{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--ligne);padding:13px;margin:16px 0 12px}
.bascule input{width:22px;height:22px;accent-color:var(--orange);flex:none}
.bascule span{font-size:14px}
.bascule small{display:block;color:var(--pale);font-size:12px}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.aide{font-size:12px;color:var(--pale);margin-top:5px}
.mot{background:#F7F5F2;border-left:4px solid var(--noir);padding:10px 12px;margin-top:8px;
  font-size:13.5px;font-style:italic;color:var(--texte);white-space:pre-line}
.note-suivi{white-space:pre-line;font-size:14px;color:var(--texte)}
.note-vide{font-size:13.5px;color:var(--pale);font-style:italic}

.etat{padding:40px 18px;text-align:center;color:var(--doux);font-size:14.5px}
.etat b{display:block;font-size:17px;color:var(--texte);margin-bottom:7px}
.etat code{display:block;background:#EFEBE5;padding:9px;margin-top:11px;font-size:11px;text-align:left;word-break:break-all}
.pied{text-align:center;font-size:11.5px;color:var(--pale);padding:16px 0 4px;white-space:pre-line}
.attente{position:fixed;inset:0;background:rgba(11,10,9,.55);display:none;place-items:center;z-index:60}
.attente.on{display:grid}
.attente div{background:#fff;padding:20px 26px;font-size:14px;font-weight:600}
</style>
</head>
<body>

<div class="bandeau demo" id="bandeauDemo" hidden>Mode démonstration — données d'exemple</div>
<div class="bandeau" id="flash" hidden></div>

<header>
  <div class="hd">
    <div>
      <div class="marque">OLIVE <span>CONDUITE</span></div>
      <div class="sous" id="sous">Permis Score</div>
    </div>
    <button class="ico" id="btnRecharger" aria-label="Recharger">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></svg>
    </button>
  </div>
  <div class="chercher" id="zoneRecherche">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="recherche" type="search" placeholder="Chercher un élève" autocomplete="off">
  </div>
</header>

<main>
  <section class="vue on" id="vListe"></section>
  <section class="vue" id="vFiche"></section>
  <section class="vue" id="vLecon"></section>
  <section class="vue" id="vEleve"></section>
</main>

<div class="attente" id="attente"><div id="attenteTxt">Enregistrement…</div></div>

<script>
/* ====================================================================
   RÉGLAGES — deux lignes à remplacer.
   Tableur : menu Olive Conduite > Réglages de l'application
   ==================================================================== */
var ADRESSE = "https://script.google.com/macros/s/METTEZ_VOTRE_ADRESSE_ICI/exec";
var CLE     = "olive-2026-change-moi";
/* ==================================================================== */

var D = null, filtre = "", courant = null, DEMO = false;
var COMP = ["Maîtrise du véhicule","Observation","Anticipation","Intersections","Priorités",
            "Vitesse et allure","Stationnement et manœuvres","Autonomie","Environnement complexe"];
var MOTS = {0:"non abordé",1:"découverte",2:"guidé",3:"peu guidé",4:"autonome"};

/* ---------------------------------------------------------- utilitaires */
function $(id){ return document.getElementById(id); }
function ech(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function flash(msg, ok){
  var f = $("flash");
  f.textContent = msg + (ok ? "" : "   (toucher pour fermer)");
  f.className = "bandeau " + (ok ? "ok" : "ko");
  f.hidden = false;
  clearTimeout(flash.t);
  if (ok) flash.t = setTimeout(function(){ f.hidden = true; }, 6000);
}
document.getElementById("flash").addEventListener("click", function(){ this.hidden = true; });
function attente(on, txt){ $("attenteTxt").textContent = txt || "Enregistrement…"; $("attente").classList.toggle("on", !!on); }
function dest(e){
  var out = [];
  [e.email, e.email2].forEach(function(a){
    a = String(a || "").trim();
    if (a && out.indexOf(a) < 0) out.push(a);
  });
  return out;
}
function eleve(nom){ for (var i=0;i<D.eleves.length;i++) if (D.eleves[i].nom===nom) return D.eleves[i]; return null; }
function score(niv){ var s=0; for(var i=0;i<niv.length;i++) s+=niv[i]; return Math.round(s/36*100); }
function auj(){ var d=new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }

/* ---------------------------------------------------------- appels serveur */
function appel(params, ensuite) {
  if (DEMO) { ensuite({ ok:false, erreur:"Mode démonstration : rien n'est enregistré." }); return; }
  var nomCb = "cb" + Date.now();
  var fini = false;
  window[nomCb] = function (r) {
    fini = true; attente(false);
    try { delete window[nomCb]; } catch (e) { window[nomCb] = undefined; }
    ensuite(r);
  };
  var url = ADRESSE + "?cle=" + encodeURIComponent(CLE) + "&callback=" + nomCb + "&t=" + Date.now();
  for (var k in params) if (params.hasOwnProperty(k)) url += "&" + k + "=" + encodeURIComponent(params[k]);
  var s = document.createElement("script");
  s.src = url;
  s.onerror = function () { if (!fini) { attente(false); ensuite({ ok:false, erreur:"Connexion impossible." }); } };
  document.body.appendChild(s);
  setTimeout(function(){ if(!fini){ attente(false); ensuite({ ok:false, erreur:"Le serveur ne répond pas." }); } }, 20000);
}

function charger(silencieux) {
  if (ADRESSE.indexOf("METTEZ_VOTRE_ADRESSE_ICI") >= 0) {
    DEMO = true; $("bandeauDemo").hidden = false; D = jeuDemo(); rendreListe(); return;
  }
  $("btnRecharger").classList.add("tourne");
  appel({ api:"data" }, function (r) {
    $("btnRecharger").classList.remove("tourne");
    if (r.ok && r.data) { D = r.data; rendreListe(); if(!silencieux) return; }
    else if (r.erreur) {
      if (!D) $("vListe").innerHTML = '<div class="etat"><b>' + ech(r.erreur) + '</b>'
        + 'Vérifiez l\'adresse et la clé en haut du fichier index.html, '
        + 'et que le déploiement est en accès « Tous les utilisateurs ».'
        + '<code>' + ech(ADRESSE) + '</code></div>';
      else flash(r.erreur, false);
    }
  });
}

function apres(r, msgOk) {
  if (!r.ok) { flash(r.erreur || "Échec", false); return false; }
  if (r.data) D = r.data;
  var m = msgOk || r.message || "Enregistré";
  if (r.mail && r.mail !== "non demandé") m += " — " + r.mail;
  flash(m, r.mail ? r.mail.indexOf("Envoyé") === 0 || r.mail === "non demandé" : true);
  return true;
}

/* ---------------------------------------------------------- vue : liste */
function rendreListe() {
  var el = D.eleves.slice().sort(function (a,b) {
    if (a.actif !== b.actif) return a.actif ? -1 : 1;
    if (a.score === null) return 1; if (b.score === null) return -1;
    return b.score - a.score;
  });
  if (filtre) {
    var f = filtre.toLowerCase();
    el = el.filter(function(e){ return (e.nom+" "+e.formation).toLowerCase().indexOf(f) >= 0; });
  }
  var h = '<button class="btn noir" onclick="formEleve(null)">+ Nouvel élève</button>';
  h += el.length ? el.map(carte).join("")
     : '<div class="etat"><b>Aucun élève</b>' + (filtre ? "Aucun résultat." : "Commencez par en créer un.") + '</div>';
  h += '<div class="pied">Objectif examen ' + D.objectif + '/100 — mis à jour le ' + ech(D.maj)
     + '\n' + D.totalLecons + ' leçon' + (D.totalLecons>1?"s":"") + ' enregistrée'
     + (D.totalLecons>1?"s":"") + ' au total</div>';
  $("vListe").innerHTML = h;
  $("sous").textContent = D.eleves.length + " élève" + (D.eleves.length>1?"s":"") + " · " + D.maj;
  montrer("vListe");
}

function carte(e) {
  var t = 'onclick="ouvrir(\'' + ech(e.nom).replace(/'/g,"\\'") + '\')"';
  var h = '<button class="carte' + (e.pret?" pret":"") + (e.actif?"":" inactif") + '" ' + t + '>'
    + '<div class="nom">' + ech(e.nom) + (e.actif?"":" · archivé") + '</div>'
    + '<div class="form">' + ech(e.formation) + '</div>';
  if (e.score === null) return h + '<div class="info">Aucune leçon enregistrée</div></button>';
  var urgent = !e.pret && e.restant <= 3;
  return h
    + '<div class="rang"><div class="pts' + (e.pret?" ok":"") + '">' + e.score + '<em>/100</em></div>'
    + '<div class="jauge' + (e.pret?" ok":"") + '"><i style="width:' + Math.max(2,e.score) + '%"></i>'
    + '<u style="left:' + D.objectif + '%"></u></div></div>'
    + '<div class="info">' + e.heures + ' h · ' + e.lecons + ' leçon' + (e.lecons>1?"s":"")
    + ' · dernière le ' + ech(e.derniere.date) + '</div>'
    + '<div class="puce' + (e.pret?" ok":(urgent?" urgent":"")) + '">'
    + (e.pret ? "PRÊT POUR L'EXAMEN" : "ENCORE " + e.restant + " H ESTIMÉES") + '</div></button>';
}

/* ---------------------------------------------------------- vue : fiche */
function ouvrir(nom) {
  courant = nom;
  var e = eleve(nom); if (!e) return;
  var h = '<button class="retour" onclick="rendreListe()">&larr; Tous les élèves</button>';

  h += '<div class="bloc"><div class="ligne-nom">'
     + '<div><div class="nom" style="font-size:19px">' + ech(e.nom) + '</div>'
     + '<div class="form">' + ech(e.formation) + '</div>'
     + '<div class="form' + (e.email ? '' : ' manque') + '">'
     + (e.email ? ech(e.email) : 'aucune adresse e-mail') + '</div>'
     + (e.email2 && e.email2 !== e.email
        ? '<div class="form">' + ech(e.email2) + ' (parent)</div>' : '') + '</div>'
     + '<button class="crayon" onclick="formEleve(courant)" aria-label="Modifier la fiche">'
     + '<svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>'
     + '</button></div>';
  if (e.score !== null) {
    h += '<div class="grand' + (e.pret?" ok":"") + '" style="margin-top:13px">' + e.score + '<em> / 100</em></div>'
       + '<div class="jauge' + (e.pret?" ok":"") + '" style="margin-top:11px"><i style="width:'
       + Math.max(2,e.score) + '%"></i><u style="left:' + D.objectif + '%"></u></div>'
       + '<div class="info">Objectif ' + D.objectif + ' · ' + e.heures + ' h · '
       + e.lecons + ' leçon' + (e.lecons>1?"s":"") + '</div>'
       + '<div class="puce' + (e.pret?" ok":"") + '">'
       + (e.pret ? "PRÊT POUR L'EXAMEN" : "ENCORE " + e.restant + " H ESTIMÉES") + '</div>';
  } else {
    h += '<div class="info" style="margin-top:10px">Aucune leçon enregistrée pour l\'instant.</div>';
  }
  h += '</div>';

  h += '<div class="bloc"><div class="tt">NOTE DE SUIVI</div>'
    + '<div id="noteLecture">'
    +   (e.note ? '<div class="note-suivi">' + ech(e.note) + '</div>'
              : '<div class="note-vide">Aucune note pour cet élève.</div>')
    +   '<button class="btn vide" style="margin-top:11px" onclick="editerNote()">'
    +   (e.note ? 'Modifier la note' : 'Ajouter une note') + '</button>'
    + '</div>'
    + '<div id="noteEdition" hidden>'
    +   '<textarea id="nTxt" maxlength="800">' + ech(e.note) + '</textarea>'
    +   '<div class="aide">Note interne. Elle n\'est jamais envoyée à l\'élève.</div>'
    +   '<button class="btn" style="margin-top:10px" onclick="sauverNote()">Enregistrer la note</button>'
    +   '<button class="btn vide" onclick="ouvrir(courant)">Annuler</button>'
    + '</div></div>';

  h += '<button class="btn" onclick="formLecon()">+ Nouvelle leçon</button>';
  if (e.score !== null && (e.email || e.email2)) {
    h += '<button class="btn vide" onclick="renvoyer()">Renvoyer le dernier score par e-mail</button>';
    h += '<button class="btn vide" onclick="envoyerBilan()">Envoyer le bilan complet à l\'élève</button>';
    h += '<div class="aide" style="text-align:center;margin:-4px 0 9px">Le bilan reprend toutes les leçons, '
       + 'les dates, les durées, les commentaires et la progression.</div>';
  }
  h += '<button class="btn vide" onclick="formEleve(courant)">Modifier le nom, l\'e-mail, la formation</button>';

  if (e.score !== null) {
    h += '<div class="bloc"><div class="tt">À TRAVAILLER EN PRIORITÉ</div>'
      + e.priorites.map(function(p,i){
          return '<div class="prio"><b>' + (i+1) + '</b><span>' + ech(p.nom)
               + '<small>' + ech(p.mot) + ', niveau ' + p.niveau + ' sur 4</small></span></div>'; }).join("")
      + '</div>';

    var noms3 = e.priorites.map(function(p){ return p.nom; });
    h += '<div class="bloc"><div class="tt">LES NEUF COMPÉTENCES</div>'
      + D.competences.map(function(c,k){
          var n = e.niveaux[k];
          var cls = n>=4 ? " acquise" : (noms3.indexOf(c)>=0 ? " faible" : "");
          return '<div class="comp' + cls + '"><div class="l"><span>' + ech(c)
               + '<small>' + (D.mots[n]||"") + '</small></span><b>' + n + '/4</b></div>'
               + '<div class="b"><i style="width:' + (n/4*100) + '%"></i></div></div>'; }).join("")
      + '</div>';

    h += '<div class="bloc"><div class="tt">PROGRESSION</div>' + courbeSvg(e.courbe)
       + '<div class="suite">' + e.courbe.join(" › ") + '</div></div>';

    h += '<div class="bloc"><div class="tt">HISTORIQUE DES LEÇONS</div>'
      + e.historique.map(function(l){
          return '<div class="histo"><div class="sc">' + l.score + '</div><div>'
               + '<div class="d">' + ech(l.date) + ' · ' + l.duree + ' h</div>'
               + '<div class="t">' + ech(l.theme || "—") + '</div>'
               + (l.comm ? '<div class="mot">' + ech(l.comm) + '</div>' : '')
               + '</div></div>'; }).join("")
      + '</div>';
  }
  $("vFiche").innerHTML = h;
  montrer("vFiche");
}

function courbeSvg(c) {
  if (!c || c.length < 2) return "";
  var L = 300, H = 68, m = 5;
  var pts = c.map(function(v,i){
    var x = m + i*(L-2*m)/(c.length-1);
    var y = H - 6 - (v/100)*(H-13);
    return x.toFixed(1)+","+y.toFixed(1);
  });
  var ys = H - 6 - (D.objectif/100)*(H-13);
  var d = pts[pts.length-1].split(",");
  return '<svg class="courbe" viewBox="0 0 '+L+' '+H+'" preserveAspectRatio="none">'
    + '<line x1="0" y1="'+ys.toFixed(1)+'" x2="'+L+'" y2="'+ys.toFixed(1)+'" stroke="#0B0A09" stroke-width="1" stroke-dasharray="4 4"/>'
    + '<polyline points="'+pts.join(" ")+'" fill="none" stroke="#F26522" stroke-width="3" '
    + 'stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>'
    + '<circle cx="'+d[0]+'" cy="'+d[1]+'" r="4" fill="#0B0A09"/></svg>';
}

/* ---------------------------------------------------------- vue : nouvelle leçon */
var saisie = { duree: 1, notes: [null,null,null,null,null,null,null,null,null] };

function formLecon() {
  var e = eleve(courant); if (!e) return;
  saisie = { duree: 1, notes: [null,null,null,null,null,null,null,null,null] };
  var h = '<button class="retour" onclick="ouvrir(courant)">&larr; ' + ech(e.nom) + '</button>'
    + '<div class="bloc"><div class="tt">NOUVELLE LEÇON — ' + ech(e.nom).toUpperCase() + '</div>'
    + '<label>Date</label><input type="date" id="lDate" value="' + auj() + '">'
    + '<label>Durée</label><div class="chips" id="lDuree">'
    +   ['0.75|45 min','1|1 h','1.5|1 h 30','2|2 h'].map(function(x,i){
          var p = x.split("|");
          return '<button class="chip" data-v="'+p[0]+'" aria-pressed="'+(i===1)+'">'+p[1]+'</button>'; }).join("")
    + '</div>'
    + '<label>Thème travaillé</label>'
    + '<input type="text" id="lTheme" placeholder="Ronds-points de la rocade">'
    + '<label>Commentaire de la leçon</label>'
    + '<textarea id="lComm" maxlength="400" placeholder="Bien meilleure observation aux intersections. On reverra le créneau la prochaine fois."></textarea>'
    + '<div class="aide">Facultatif. Ce commentaire figure dans l\'e-mail envoyé à l\'élève, sous le titre « Le mot d\'Olivier ».</div>'
    + '</div>'

    + '<div class="bloc"><div class="tt">CE QUI A ÉTÉ TRAVAILLÉ AUJOURD\'HUI</div>'
    + '<div class="info" style="margin:0 0 10px">Laissez sur — pour les compétences non abordées : '
    + 'le niveau précédent est conservé.</div>'
    + D.competences.map(function(c,k){
        var actuel = e.niveaux[k];
        return '<div class="note-l"><span>' + ech(c)
             + '<small> actuellement ' + actuel + '/4</small></span></div>'
             + '<div class="niv" data-k="'+k+'">'
             + '<button class="zero" data-n="" aria-pressed="true">—</button>'
             + [1,2,3,4].map(function(n){ return '<button data-n="'+n+'" aria-pressed="false">'+n+'</button>'; }).join("")
             + '</div>'; }).join("")
    + '</div>'

    + '<div class="bascule"><input type="checkbox" id="lMail"' + (e.email ? " checked" : " disabled") + '>'
    + '<span>Envoyer le score à l\'élève'
    + '<small>' + (dest(e).length ? ech(dest(e).join(" et ")) : "aucune adresse renseignée") + '</small></span></div>'

    + '<button class="btn" onclick="enregistrerLecon()">Enregistrer la leçon</button>'
    + '<button class="btn vide" onclick="ouvrir(courant)">Annuler</button>';

  $("vLecon").innerHTML = h;

  $("lDuree").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if(!b) return;
    this.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
    b.setAttribute("aria-pressed","true"); saisie.duree = parseFloat(b.dataset.v);
  });
  $("vLecon").querySelectorAll(".niv").forEach(function(g){
    g.addEventListener("click", function(ev){
      var b = ev.target.closest("button"); if(!b) return;
      this.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
      b.setAttribute("aria-pressed","true");
      saisie.notes[parseInt(this.dataset.k,10)] = b.dataset.n === "" ? null : parseInt(b.dataset.n,10);
    });
  });
  montrer("vLecon");
}

function enregistrerLecon() {
  var theme = $("lTheme").value.trim();
  if (!theme) { flash("Indiquez le thème travaillé.", false); $("lTheme").focus(); return; }
  attente(true, "Enregistrement de la leçon…");
  appel({
    api   : "lecon",
    eleve : courant,
    date  : $("lDate").value,
    duree : saisie.duree,
    theme : theme,
    comm  : $("lComm").value.trim(),
    notes : saisie.notes.map(function(n){ return n === null ? "" : n; }).join(","),
    mail  : $("lMail").checked ? 1 : 0
  }, function (r) { if (apres(r)) ouvrir(courant); });
}

function editerNote() {
  $("noteLecture").hidden = true;
  $("noteEdition").hidden = false;
  $("nTxt").focus();
}

function sauverNote() {
  attente(true, "Enregistrement de la note…");
  appel({ api:"note", eleve: courant, note: $("nTxt").value.trim() },
    function (r) { if (apres(r)) ouvrir(courant); });
}

function envoyerBilan() {
  var e = eleve(courant);
  if (!confirm("Envoyer le bilan complet de " + e.lecons + " leçon"
      + (e.lecons > 1 ? "s" : "") + " à " + dest(e).join(" et ") + " ?")) return;
  attente(true, "Préparation du bilan…");
  appel({ api:"bilan", eleve: courant }, function (r) {
    attente(false);
    if (r.data) D = r.data;
    flash(r.message || r.erreur || "—", !!r.ok);
    ouvrir(courant);
  });
}

function renvoyer() {
  attente(true, "Envoi de l'e-mail…");
  appel({ api:"mail", eleve: courant }, function (r) {
    attente(false);
    if (r.data) D = r.data;
    flash(r.message || r.erreur || "—", !!r.ok);
    ouvrir(courant);
  });
}

/* ---------------------------------------------------------- vue : fiche élève */
function formEleve(nom) {
  var e = nom ? eleve(nom) : { nom:"", email:"", email2:"", formation:"", actif:true, score:null };
  var nouveau = !nom;
  var h = '<button class="retour" onclick="' + (nouveau ? 'rendreListe()' : 'ouvrir(courant)') + '">&larr; Retour</button>'
    + '<div class="bloc"><div class="tt">' + (nouveau ? "NOUVEL ÉLÈVE" : "MODIFIER LA FICHE") + '</div>'
    + '<label>Prénom et nom</label><input type="text" id="eNom" value="' + ech(e.nom) + '" placeholder="Lola G.">'
    + '<label>Adresse e-mail</label><input type="email" id="eMail" value="' + ech(e.email) + '" placeholder="prenom@exemple.fr">'
    + '<label>E-mail du parent ou du tuteur</label>'
    + '<input type="email" id="eMail2" value="' + ech(e.email2 || "") + '" placeholder="facultatif">'
    + '<div class="aide">Renseignée, cette adresse reçoit une copie de chaque score et du bilan complet.</div>'
    + '<label>Formation</label><input type="text" id="eForm" value="' + ech(e.formation) + '" placeholder="Permis B – Pack Classic">'
    + '</div>'
    + '<button class="btn" onclick="sauverEleve(' + (nouveau ? 'null' : 'true') + ')">Enregistrer</button>';
  if (!nouveau) {
    h += '<button class="btn danger" onclick="archiver(' + (e.actif ? 0 : 1) + ')">'
       + (e.actif ? "Archiver cet élève" : "Réactiver cet élève") + '</button>';
    h += '<div class="info" style="text-align:center">L\'archivage conserve toutes les leçons.</div>';
  }
  $("vEleve").innerHTML = h;
  montrer("vEleve");
}

function sauverEleve(modif) {
  var nom = $("eNom").value.trim();
  if (!nom) { flash("Le nom est obligatoire.", false); return; }
  attente(true, "Enregistrement…");
  if (modif) {
    var e = eleve(courant);
    appel({ api:"eleveUpd", ancien: courant, nom: nom,
            email: $("eMail").value.trim(), email2: $("eMail2").value.trim(),
            formation: $("eForm").value.trim(), actif: e.actif ? 1 : 0 },
      function (r) { if (apres(r)) { courant = nom; ouvrir(nom); } });
  } else {
    appel({ api:"eleveAdd", nom: nom, email: $("eMail").value.trim(),
            email2: $("eMail2").value.trim(), formation: $("eForm").value.trim() },
      function (r) { if (apres(r)) { courant = nom; ouvrir(nom); } });
  }
}

function archiver(actif) {
  attente(true, "Enregistrement…");
  appel({ api:"eleveArch", nom: courant, actif: actif },
    function (r) { if (apres(r)) rendreListe(); });
}

/* ---------------------------------------------------------- navigation */
function montrer(id) {
  ["vListe","vFiche","vLecon","vEleve"].forEach(function(v){
    $(v).classList.toggle("on", v === id);
  });
  $("zoneRecherche").style.display = (id === "vListe") ? "" : "none";
  window.scrollTo(0,0);
}

$("btnRecharger").addEventListener("click", function(){ charger(); });
$("recherche").addEventListener("input", function(ev){ filtre = ev.target.value; if (D) rendreListe(); });

/* ---------------------------------------------------------- démonstration */
